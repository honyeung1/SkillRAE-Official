[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrae"
version = "0.2.0"
description = "Support-aware skill selection for retrieval-augmented execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["markdown-it-py", "numpy", "scikit-learn", "openai", "httpx", "tiktoken"]

[project.optional-dependencies]
retrieval = ["sentence-transformers"]

[project.scripts]
skillrae = "skillrae.cli:main"

[tool.setuptools.packages.find]
include = ["skillrae*"]
